# Add-ons: extra Remnawave users whose configs are appended to the main
# user's subscription. Copy to addons.yml (next to compose.yml) and edit.
#
# For a main user "alice", an add-on with prefix "premium_" looks up the
# user "premium_alice". If it exists and is ACTIVE, its configs are added to
# alice's subscription (all formats: base64, xray-json, sing-box, mihomo)
# with names rewritten by `remark`.

# Max time for all add-on lookups of one request. On timeout the main
# subscription is served alone.
timeout: 2s

addons:
  - name: premium        # only for logs
    prefix: premium_     # add-on username = prefix + main username + suffix
    # suffix: _premium

    # Name of each add-on config. Placeholders:
    #   {remark}     original config name
    #   {remaining}  traffic left, GB (one decimal)
    #   {limit}      traffic limit, GB
    #   {used}       traffic used, GB
    remark: "⭐ Premium · {remark} · {remaining} of {limit} GB left"
    # Used when the add-on user has no traffic limit. Defaults to `remark`.
    remarkUnlimited: "⭐ Premium · {remark} · unlimited"

    # When the add-on user is not ACTIVE, one unusable placeholder config
    # (0.0.0.0:1) with this name is added instead. Statuses: LIMITED,
    # EXPIRED, DISABLED. A missing or empty status adds nothing.
    stubs:
      LIMITED: "⭐ Premium: traffic limit reached, top up to continue"
      EXPIRED: "⭐ Premium: subscription expired, renew to continue"
      # DISABLED: ""

  # Ready-made configs instead of the add-on user's panel subscription.
  # `extra_<username>` must still exist in the panel and be ACTIVE (otherwise
  # `stubs` apply as above); the configs are added to every subscription
  # format. Supported links: vless://, hysteria2:// (hy2://). hysteria2 is
  # skipped in xray-json output.
  - name: extra
    prefix: extra_
    links:
      # `remark` is this config's name; same placeholders as above, plus
      # {remark} = the #name in the link. Empty falls back to the add-on's
      # `remark`. Unlimited traffic shows ∞, unknown usage shows ?.
      - remark: "Extra · {remaining} of {limit} GB left"
        link: "vless://11111111-1111-1111-1111-111111111111@example.com:443?type=tcp&security=reality&sni=example.com&fp=chrome&pbk=PUBLIC_KEY&sid=ab12&flow=xtls-rprx-vision#Extra"
      - remark: "Extra hy2 · {remaining} of {limit} GB left"
        link: "hysteria2://password@example.com:443?sni=example.com&obfs=salamander&obfs-password=secret#Extra-hy2"
      # Instead of `link`, `match` takes the config from the subscription at
      # `usage.url` (requires `usage`). `match` is a regular expression (Go
      # RE2) tested against config names: unanchored and case-sensitive. Only
      # the first matching config is used; set `all: true` to add every match.
      # The subscription may be base64/plain links, xray-json, sing-box or
      # mihomo, whichever the provider returns for the `user-agent` below;
      # only vless and hysteria2 configs are read. Names are exactly what that
      # client shows, so check them in the client first (in xray-json a name
      # is the entry's remarks, shared by all its servers). Configs chained
      # through another outbound (dialerProxy) are skipped. If the
      # subscription is unreachable or nothing matches, the item is skipped.
      #
      # Extra placeholders for `match` items:
      #   {remark}  the name found in the subscription
      #   {n}       running number of the config in this add-on (1, 2, ...)
      #   {dup}     empty for the first config with a given resulting name,
      #             " #2", " #3"... for repeats of it
      #   {name}    every named group (?P<name>...) of the regular expression
      #
      # --- Examples (names look like "🇩🇪 Germany | Hysteria 2 · Salamander") ---
      #
      # Plain substring / several words in order:
      #   match: "Germany.*Salamander"
      # Exact name:
      #   match: '^🇩🇪 Germany \| Hysteria 2$'
      # Either of two countries (alternation):
      #   match: "(Germany|Netherlands).*Hysteria"
      # Case-insensitive (the (?i) flag):
      #   match: "(?i)germany.*salamander"
      # Ends right after "Hysteria 2" (no Salamander or id tag after it):
      #   match: 'Germany.*Hysteria 2$'
      # Starts with a flag emoji:
      #   match: '^\p{So}+ '
      #
      # Named groups become placeholders in `remark`:
      #   - remark: "LTE · {flag}{dup} · {remaining} of {limit} GB"
      #     match: '^(?P<flag>\S+) .*(Germany|Netherlands)'
      #     all: true
      #   -> "LTE · 🇩🇪 · 34.4 of 35 GB", "LTE · 🇩🇪 #2 · ..." for a repeated flag
      #
      #   - remark: "{country}{dup} · {remaining}/{limit} GB"
      #     match: '\| (?P<country>[^·|]+?) · Hysteria.*Salamander'
      #     all: true
      #   -> "Germany · 34.4/35 GB" (the text between "| " and " · Hysteria")
      #
      #   - remark: "LTE #{n} · {id}"
      #     match: ' · (?P<id>[0-9a-f]{6})$'
      #     all: true
      #   -> "LTE #1 · 733fe4", "LTE #2 · e61b9c" (a trailing 6-hex tag)
      #
      # Several items may match the same config; each makes its own entry, so
      # keep the patterns disjoint unless you want duplicates.
      - remark: "{remark} · {remaining} of {limit} GB left"
        match: "Germany.*Salamander"
        # all: true
    # Where traffic numbers come from: the Subscription-Userinfo header of
    # this URL (and the configs for `match` from its body). Headers are sent
    # only with this request (use them to pass the HWID check). Without
    # `usage`, the panel add-on user's numbers are used.
    usage:
      url: https://provider.example/sub/TOKEN
      headers:
        x-hwid: "YOUR-DEVICE-HWID"
        x-device-os: "iOS"
        x-device-model: "iPhone15,2"
        user-agent: "Happ/1.0"
      cache: 5m
    stubs:
      LIMITED: "Extra: traffic limit reached"
      EXPIRED: "Extra: subscription expired"
