<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <base href="/" />
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
        <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="icon" sizes="32x32" type="image/png" href="/assets/favicon-32x32.png" />
        <link rel="icon" sizes="16x16" type="image/png" href="/assets/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180x180.png" />

        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com" />
        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com" />

        <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
            rel="stylesheet"
        />

        <meta name="description" content="{{.MetaDescription}}" />
        <title>{{.MetaTitle}}</title>

        <script>
            // Apply the saved colour scheme before the first paint (no flash).
            try {
                var s = localStorage.getItem('mantine-color-scheme-value') || 'auto'
                if (s === 'auto') s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                document.documentElement.setAttribute('data-mantine-color-scheme', s)
            } catch (e) {
                document.documentElement.setAttribute(
                    'data-mantine-color-scheme',
                    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                )
            }
        </script>

        <style>
            :root {
                --il-bg: #f6f6f7;
                --il-track: rgb(9 9 11 / 12%);
            }

            :root[data-mantine-color-scheme='dark'] {
                --il-bg: #09090b;
                --il-track: rgb(255 255 255 / 12%);
            }

            html,
            body {
                margin: 0;
                background: var(--il-bg);
            }

            #initial-loader {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--il-bg);
            }

            #initial-loader .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid var(--il-track);
                border-top-color: #7958f8;
                border-radius: 50%;
                animation: initial-loader-spin 0.8s linear infinite;
            }

            @keyframes initial-loader-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div id="initial-loader">
                <div class="spinner"></div>
            </div>
        </div>
        <script type="module" src="./src/main.tsx"></script>

        <div id="sbpg" data-panel="{{.PanelData}}"></div>
    </body>
</html>
